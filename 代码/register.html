<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户注册</title>
  <link rel="stylesheet" href="my.css">
  <style>
    /* 注册表单专用样式 */
    .register-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    
    .register-card {
      width: 100%;
      max-width: 400px;
      background: var(--bg-sidebar);
      border-radius: 12px;
      box-shadow: var(--shadow-md);
      overflow: hidden;
      border: 1px solid var(--border-color);
    }
    
    .register-header {
      padding: 24px 20px;
      text-align: center;
      background: var(--accent-color);
      color: white;
    }
    
    .register-header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 600;
    }
    
    .register-body {
      padding: 30px 24px;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: var(--text-secondary);
      font-weight: 500;
    }
    
    .form-control {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 16px;
      background: var(--bg-primary);
      color: var(--text-primary);
      transition: all 0.2s;
    }
    
    .form-control:focus {
      outline: none;
      border-color: var(--accent-color);
      box-shadow: 0 1px 3px rgba(184, 142, 141, 0.2);
    }
    
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: var(--accent-color);
      color: white;
    }
    
    .btn-primary:hover {
      background: var(--accent-hover);
    }
    
    .form-footer {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
      color: var(--text-secondary);
    }
    
    .form-footer a {
      color: var(--accent-color);
      text-decoration: none;
    }
    
    .form-footer a:hover {
      text-decoration: underline;
    }
    
    @media (max-width: 480px) {
      .register-card {
        border-radius: 8px;
      }
      
      .register-body {
        padding: 24px 16px;
      }
    }
  </style>
</head>
<body>
  <div class="register-container">
    <div class="register-card">
      <div class="register-header">
        <h1>用户注册</h1>
      </div>
      <div class="register-body">
        <form id="registerForm">
          <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" id="username" class="form-control" placeholder="请输入用户名" required>
          </div>
          
          <div class="form-group">
            <label for="email">邮箱</label>
            <input type="email" id="email" class="form-control" placeholder="请输入邮箱地址" required>
          </div>
          
          <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" class="form-control" placeholder="请输入密码" required>
          </div>
          
          <div class="form-group">
            <label for="confirmPassword">确认密码</label>
            <input type="password" id="confirmPassword" class="form-control" placeholder="请再次输入密码" required>
          </div>
          
          <button type="submit" class="btn btn-primary">立即注册</button>
        </form>
        
        <div class="form-footer">
          已有账号？<a href="#">立即登录</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      
      // 简单的表单验证
      if (password !== confirmPassword) {
        alert('密码和确认密码不一致！');
        return;
      }
      
      // 这里可以添加更多验证逻辑
      alert(`注册成功！\n用户名: ${username}\n邮箱: ${email}`);
      
      // 重置表单
      this.reset();
    });
  </script>
</body>
</html>
